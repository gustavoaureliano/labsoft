databases:
  - name: aprovaai-postgres-lucas
    plan: free
    region: oregon
    databaseName: aprovaai
    user: aprovaai

services:
  - type: web
    name: aprovaai-backend-lucas
    runtime: python
    plan: free
    region: oregon
    branch: backend_lucas
    rootDir: backend
    buildCommand: uv sync --locked --no-dev
    startCommand: uv run --no-dev alembic upgrade head && uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aprovaai-postgres-lucas
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: MEDIA_ROOT
        value: /tmp/aprovaai-media
      - key: MEDIA_SIGNING_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://aprovaai-frontend-lucas.onrender.com

  - type: web
    name: aprovaai-frontend-lucas
    runtime: node
    plan: free
    region: oregon
    branch: backend_lucas
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start -- -H 0.0.0.0 -p $PORT
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NEXT_PUBLIC_API_URL
        value: https://aprovaai-backend-lucas.onrender.com
      - key: NEXT_PUBLIC_DEMO_TEACHER_ID
        value: 11111111-1111-1111-1111-111111111111
      - key: NEXT_PUBLIC_DEMO_TEACHER_NAME
        value: Professor de teste
      - key: NEXT_PUBLIC_DEMO_STUDENT_ID
        value: 22222222-2222-2222-2222-222222222222
