databases:
  - name: aprovaai-postgres-lucas
    plan: free
    region: oregon
    databaseName: aprovaai
    user: aprovaai

services:
  - type: web
    name: aprovaai-backend-lucas
    runtime: python
    plan: free
    region: oregon
    branch: backend_lucas
    rootDir: backend
    buildCommand: uv sync --locked --no-dev
    startCommand: uv run --no-dev alembic upgrade head && uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aprovaai-postgres-lucas
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: MEDIA_ROOT
        value: /tmp/aprovaai-media
      - key: MEDIA_SIGNING_KEY
        generateValue: true
