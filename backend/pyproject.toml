[project]
name = "aprova-ai-backend"
version = "0.1.0"
description = "API da plataforma AprovaAí"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2.0",
    "fastapi>=0.115,<1.0",
    "pillow>=11,<13",
    "psycopg[binary]>=3.2,<4.0",
    "python-multipart>=0.0.20,<1.0",
    "reportlab>=4,<5",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "pypdf>=5,<7",
    "httpx2>=2,<3",
    "pytest>=8.0,<10.0",
]
