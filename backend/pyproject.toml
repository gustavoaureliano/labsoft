[project]
name = "aprova-ai-backend"
version = "0.1.0"
description = "API da plataforma AprovaAí"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2.0",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.115,<1.0",
    "PyJWT>=2.10,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic[email]>=2.14.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
